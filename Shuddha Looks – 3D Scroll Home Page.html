<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shuddha Looks – Your Ultimate Skin Defense Trio</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4faf1;--ink:#1c2a22;--muted:#59675f;--acc:#3f9d5a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;transition:background .9s ease;overflow-x:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#journey{height:935vh;position:relative}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(16px,4vw,48px)}
.logo{font:800 22px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
nav{display:flex;gap:8px}
nav button{font:500 14px 'DM Sans',sans-serif;border:1.5px solid rgba(28,42,34,.18);background:rgba(255,255,255,.7);color:var(--ink);padding:8px 14px;border-radius:99px;cursor:pointer;transition:all .3s}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
nav button:focus-visible,.cta:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#panel{position:fixed;z-index:4;left:clamp(16px,5vw,80px);top:50%;transform:translateY(-50%);width:min(460px,42vw);transition:opacity .25s ease,translate .25s ease}
#panel.out{opacity:0;translate:0 14px}
.badge{display:inline-block;font:500 14px 'DM Sans',sans-serif;color:var(--acc);margin:0 0 10px}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.03em;margin:0}
h1{font-size:clamp(40px,5.4vw,76px);line-height:1;font-weight:800}
h2{font-size:clamp(34px,4.2vw,58px);line-height:1.02;font-weight:800}
h3{font-size:clamp(28px,3.4vw,46px);line-height:1.05;font-weight:700;margin:6px 0 14px}
.pname{font:500 16px 'DM Sans',sans-serif;color:var(--muted);margin:0}
p.lead{font-size:clamp(16px,1.35vw,19px);line-height:1.55;color:var(--muted);margin:16px 0 0;max-width:42ch}
.dots{display:flex;gap:8px;margin-top:26px}
.dots i{height:5px;width:26px;border-radius:9px;background:rgba(28,42,34,.14)}
.dots i.on{background:var(--acc);width:46px}
.price{display:flex;align-items:baseline;gap:12px;margin:18px 0 0;font:800 44px 'Bricolage Grotesque',sans-serif}
.price s{font:400 20px 'DM Sans',sans-serif;color:var(--muted)}
.cta{display:inline-block;margin-top:22px;background:var(--ink);color:#fff;text-decoration:none;padding:15px 28px;border-radius:99px;font-weight:500}
.cue{margin-top:30px;font-size:14px;color:var(--muted)}
@media (max-width:820px){
 #panel{left:12px;right:12px;width:auto;top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:none;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);padding:18px 18px 16px;border-radius:22px}
 h1{font-size:36px}h2{font-size:30px}h3{font-size:25px;margin:4px 0 8px}p.lead{margin-top:8px;font-size:15px}.dots{margin-top:14px}.cue{margin-top:12px}.price{font-size:34px;margin-top:8px}.cta{margin-top:12px;padding:12px 22px}
 nav button{padding:7px 11px;font-size:13px}.logo{font-size:18px}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style>
</head>
<body>
<canvas id="gl" aria-label="3D view of the Shuddha Looks face wash, moisturiser and sunscreen"></canvas>
<header>
 <a class="logo" href="https://shuddhalooks.com/">Shuddha Looks</a>
 <nav id="nav" aria-label="Jump to product"></nav>
</header>
<section id="panel" aria-live="polite"></section>
<div id="journey"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const P=[
 {n:'Milkessence Face Wash',s1:'Milkessence',s2:'Face Wash',s3:'Milk Peptides + Ceramides',role:'Cleanse',c:'#2f9e57',light:'#8fdca6',tint:'#eef8ec',h:2.7,r:.5,price:349,
  f:[['Cleans without stripping','Gently lifts dirt and excess oil so your skin feels fresh and clean.'],
     ['Milk peptides nourish','Milk Peptides refresh and nourish your skin while you cleanse.'],
     ['A clean formula','Free from sulphates, parabens, alcohol and harsh chemicals. Gentle on every skin type.']]},
 {n:'Serephic Moisturiser',s1:'Serephic',s2:'Moisturiser',s3:'Ceramide + Shea + Cica',role:'Hydrate',c:'#7a49b8',light:'#c4a5ee',tint:'#f3eefa',h:2.25,r:.6,price:359,
  f:[['Strengthens your skin barrier','Ceramides help repair the natural barrier so moisture stays locked in.'],
     ['Deep nourishment','Shea butter feeds dry, tired skin. Made for all skin types.'],
     ['Comfort with Cica','Cica joins the formula to keep your skin feeling calm and comfortable.']]},
 {n:'Soleil-Elite Sunscreen',s1:'Soleil-Elite',s2:'Sunscreen',s3:'SPF 50+ PA+++',role:'Protect',c:'#ee8420',light:'#ffc486',tint:'#fff3e6',h:2.9,r:.54,price:399,
  f:[['SPF 50+ PA+++','Broad-spectrum UVA and UVB protection against daily sun damage.'],
     ['No white cast','An aqua-gel formula that absorbs quickly. No oily residue, no white marks.'],
     ['Water resistant, not greasy','Stays hydrated and comfortable on your skin all day.']]}
];
const steps=[{k:'hero'}];
P.forEach((p,i)=>p.f.forEach((f,j)=>steps.push({k:'f',i,j,t:f[0],d:f[1]})));
steps.push({k:'end'});
const N=steps.length, journey=document.getElementById('journey'), panel=document.getElementById('panel'), nav=document.getElementById('nav');
const mobile=()=>innerWidth<=820;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

/* nav */
P.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.role;b.onclick=()=>goStep(1+i*3);nav.appendChild(b)});
function maxScroll(){return journey.offsetHeight-innerHeight}
function goStep(i){scrollTo({top:i/(N-1)*maxScroll(),behavior:'smooth'})}

/* panel */
let shown=-1;
function render(i){
 const s=steps[i];let h='';
 if(s.k==='hero')h='<h1>Your ultimate skin defense trio</h1><p class="lead">Cleanse, hydrate, protect. Scroll to meet each product and see what it does for your skin.</p><p class="cue">Scroll to begin</p>';
 else if(s.k==='f'){const p=P[s.i];h=`<p class="badge">Step ${s.i+1} of 3: ${p.role}</p><p class="pname">${p.n}</p><h3>${s.t}</h3><p class="lead">${s.d}</p><div class="dots">${[0,1,2].map(j=>`<i class="${j===s.j?'on':''}"></i>`).join('')}</div>`}
 else h='<h2>Three steps to healthy, glowing skin</h2><p class="lead">Sulphate free, paraben free and cruelty free. Free shipping on every order.</p><p class="price">₹899 <s>₹1,427</s></p><a class="cta" href="https://shuddhalooks.com/products/facewash-moisturizer-sunscreen">Get the trio</a>';
 panel.innerHTML=h;
 const p=s.k==='f'?P[s.i]:null;
 document.documentElement.style.setProperty('--acc',p?p.c:'#3f9d5a');
 document.documentElement.style.setProperty('--bg',p?p.tint:'#f4faf1');
 [...nav.children].forEach((b,k)=>b.classList.toggle('on',!!p&&k===s.i));
}
function setStep(i){
 if(i===shown)return;const first=shown<0;shown=i;
 if(first){render(i);return}
 panel.classList.add('out');setTimeout(()=>{render(shown);panel.classList.remove('out')},230);
}

/* three */
const cv=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(32,1,.1,60);
scene.add(new THREE.AmbientLight(0xffffff,.8));
const key=new THREE.DirectionalLight(0xffffff,1.15);key.position.set(3,5,7);scene.add(key);
const rim=new THREE.DirectionalLight(0xffffff,.7);rim.position.set(-5,2,-4);scene.add(rim);
const front=new THREE.PointLight(0xffffff,.5,30);front.position.set(0,1,8);scene.add(front);

function label(p){
 const c=document.createElement('canvas');c.width=c.height=1024;const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,0,1024);g.addColorStop(0,p.light);g.addColorStop(1,p.c);x.fillStyle=g;x.fillRect(0,0,1024,1024);
 x.fillStyle='rgba(255,255,255,.93)';x.beginPath();if(x.roundRect)x.roundRect(322,250,380,560,40);else x.rect(322,250,380,560);x.fill();
 x.textAlign='center';x.fillStyle=p.c;
 x.font='700 30px "DM Sans",sans-serif';x.fillText('SHUDDHA LOOKS',512,320);
 x.font='800 62px "Bricolage Grotesque",sans-serif';x.fillText(p.s1,512,470);
 x.fillStyle='#1c2a22';x.font='700 44px "Bricolage Grotesque",sans-serif';x.fillText(p.s2,512,530);
 x.fillStyle='#59675f';x.font='500 26px "DM Sans",sans-serif';x.fillText(p.s3,512,620);
 x.fillStyle=p.c;x.beginPath();if(x.roundRect)x.roundRect(392,690,240,56,28);else x.rect(392,690,240,56);x.fill();
 x.fillStyle='#fff';x.font='500 24px "DM Sans",sans-serif';x.fillText('Cruelty free',512,727);
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;
}
function shadowTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');const g=x.createRadialGradient(64,64,4,64,64,62);g.addColorStop(0,'rgba(30,40,35,.35)');g.addColorStop(1,'rgba(30,40,35,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
const shTex=shadowTex();

function tube(p){
 const holder=new THREE.Group(),pivot=new THREE.Group();holder.add(pivot);
 const r=p.r,h=p.h,col=new THREE.Color(p.c);
 const pts=[[r*.9,.5],[r,.64],[r,h-.55],[r*.98,h-.34],[r*.72,h-.14],[.02,h-.1]].map(a=>new THREE.Vector2(a[0],a[1]));
 const body=new THREE.Mesh(new THREE.LatheGeometry(pts,64),new THREE.MeshPhysicalMaterial({map:label(p),roughness:.36,clearcoat:1,clearcoatRoughness:.15,metalness:.05}));
 body.rotation.y=Math.PI;pivot.add(body);
 const crimp=new THREE.Mesh(new THREE.BoxGeometry(r*1.9,.3,.1),new THREE.MeshStandardMaterial({color:col,roughness:.4}));crimp.position.y=h-.08;pivot.add(crimp);
 for(let k=0;k<5;k++){const rib=new THREE.Mesh(new THREE.BoxGeometry(r*1.9,.015,.12),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5,transparent:true,opacity:.35}));rib.position.y=h-.18+k*.05;pivot.add(rib)}
 const cap=new THREE.Mesh(new THREE.CylinderGeometry(r*.88,r*.94,.55,64),new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.25,clearcoat:1}));cap.position.y=.27;pivot.add(cap);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(r*.93,.04,16,64),new THREE.MeshStandardMaterial({color:col,roughness:.3,metalness:.3}));ring.rotation.x=Math.PI/2;ring.position.y=.55;pivot.add(ring);
 pivot.position.y=-h/2;
 const sh=new THREE.Mesh(new THREE.PlaneGeometry(r*5,r*5),new THREE.MeshBasicMaterial({map:shTex,transparent:true,depthWrite:false}));
 sh.rotation.x=-Math.PI/2;sh.position.y=-h/2-.02;holder.add(sh);
 scene.add(holder);return {holder,pivot,p};
}
const M=P.map(tube);

/* particles */
const PN=90,pg=new THREE.BufferGeometry(),pp=new Float32Array(PN*3),seed=[];
for(let i=0;i<PN;i++){pp[i*3]=(Math.random()-.5)*14;pp[i*3+1]=(Math.random()-.5)*8;pp[i*3+2]=(Math.random()-.5)*6-1;seed.push(Math.random()*6.28)}
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const pm=new THREE.PointsMaterial({size:.07,color:0x3f9d5a,transparent:true,opacity:.55,depthWrite:false});
scene.add(new THREE.Points(pg,pm));

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.position.set(0,0,mobile()?13.5:9.5);cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* loop */
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let prog=0,tgt=0,last=0,t0=performance.now();
const tc=new THREE.Color('#3f9d5a');
const FS=[1.25,1.55,1.3],FR=[-.55,.5,-.12];
function onScroll(){tgt=clamp(scrollY/Math.max(1,maxScroll()),0,1)}
addEventListener('scroll',onScroll,{passive:true});onScroll();prog=tgt;

function frame(now){
 const t=(now-t0)/1000;
 prog+=(tgt-prog)*(reduce?1:.08);
 const vel=prog-last;last=prog;
 const sf=prog*(N-1),idx=clamp(Math.round(sf),0,N-1),s=steps[idx];
 setStep(idx);
 const mob=mobile();
 M.forEach((m,i)=>{
  let x,y=0,sc,ry,rz=0;
  if(s.k==='f'){
   if(s.i===i){x=mob?0:1.9;y=mob?1.1:0;sc=(mob?.62:1)*FS[s.j]*(i===1?.95:1);ry=Math.PI*0+FR[s.j]+Math.sin(t*.6)*.18;rz=(s.j-1)*.08}
   else{x=i<s.i?-12:12;sc=.5;ry=0}
  }else{
   const sp=mob?1.35:2.2;x=(i-1)*sp;y=mob?1.1:0;sc=mob?.62:.95;ry=Math.sin(t*.7+i)*.35-(i-1)*.25;
   if(s.k==='hero'&&sf<.6)y+=(.6-sf)*.4;
  }
  const k=reduce?1:.07,h=m.holder;
  h.position.x+=(x-h.position.x)*k;h.position.y+=(y-h.position.y)*k+Math.sin(t*1.2+i)*.0012;
  const ns=h.scale.x+(sc-h.scale.x)*k;h.scale.setScalar(ns);
  m.pivot.rotation.y+=(ry-m.pivot.rotation.y)*k+vel*28;
  m.pivot.rotation.z+=(rz-m.pivot.rotation.z)*k;
 });
 const pc=s.k==='f'?P[s.i].c:'#3f9d5a';tc.lerp(new THREE.Color(pc),.05);pm.color.copy(tc);
 const a=pg.attributes.position;
 for(let i=0;i<PN;i++){a.array[i*3+1]+=Math.sin(t*.5+seed[i])*.002;a.array[i*3]+=Math.cos(t*.3+seed[i])*.0015}
 a.needsUpdate=true;pg.attributes.position.needsUpdate=true;
 renderer.render(scene,cam);
 requestAnimationFrame(frame);
}
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(()=>{
 M.forEach((m,i)=>{m.pivot.children[0].material.map=label(P[i]);m.pivot.children[0].material.needsUpdate=true});
 requestAnimationFrame(frame);
});
})();
</script>
</body>
</html>
